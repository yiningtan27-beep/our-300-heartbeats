$("saveNote").onclick=()=>{let note=$("note").value.trim();if(!note)return;records.unshift({q:current.q,cat:current.cat,note,date:new Date().toLocaleDateString("zh-CN")});$("note").value="";persist();render()};
$("showFav").onclick=()=>{showFav=!showFav;$("favorites").classList.toggle("hidden",!showFav);$("showFav").textContent=showFav?"收起":"展开"};
$("dark").onchange=e=>document.body.classList.toggle("dark",e.target.checked);$("anniv").onchange=e=>{document.querySelector(".question h2").style.fontFamily=e.target.checked?"Georgia,serif":"inherit";$("catLabel").textContent=e.target.checked?"💞 纪念日特别时刻":current.emoji+" "+current.cat};
["name1","name2"].forEach(id=>$(id).oninput=render);
render();
</script></body></html>
